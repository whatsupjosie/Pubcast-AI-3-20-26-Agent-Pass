<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --surface: #161616;
      --border:  #2a2a2a;
      --accent:  #c9a84c;
      --text:    #e8e8e8;
      --muted:   #666;
      --success: #27ae60;
      --danger:  #c0392b;
    }

    body {
      width: 260px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
    }

    header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.on { background: var(--success); }

    .title {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .status-line {
      padding: 8px 16px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      border-bottom: 1px solid var(--border);
    }

    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-icon { font-size: 14px; }

    footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .port-label {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .settings-link {
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .settings-link:hover { color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="dot" id="dot"></div>
    <span class="title">Code Collector</span>
  </header>

  <div class="status-line" id="statusLine">connecting…</div>

  <div class="actions">
    <button class="btn" id="savePrimary">
      <span class="btn-icon">📁</span> Save to Primary
    </button>
    <button class="btn" id="saveArchive">
      <span class="btn-icon">🗂</span> Save to Archive
    </button>
    <button class="btn" id="saveBoth">
      <span class="btn-icon">💾</span> Save to Both
    </button>
    <button class="btn" id="saveCloud">
      <span class="btn-icon">☁️</span> Save to Cloud folder
    </button>
  </div>

  <footer>
    <span class="port-label" id="portLabel">port —</span>
    <button class="settings-link" id="openSettings">Settings →</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
